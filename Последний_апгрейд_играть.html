    return `<div class="score-block"><div class="section-label">ПРОФИЛЬ ВОЗМОЖНОСТЕЙ · ОЦЕНОЧНО</div>${[['Рабочие задачи',work],['Игры и графика',gaming],['Мобильность',travel],['Модернизация',upgrade]].map(([label,v])=>`<div class="score-row"><span>${label}</span><div class="score-track"><i style="width:${Math.min(100,v)}%"></i></div><b>${Math.min(100,v)}/100</b></div>`).join('')}<div class="small muted">Это условные сравнительные оценки внутри игры, не результаты тестов FPS или бенчмарков.</div></div>`;
  }
  function compare(){
    if(!sectionOrder.every(x=>memory.build[x]))memory.build=recommend(memory.goal||'study',memory.budget);
    if(!memory.laptopId) memory.laptopId=recommendedLaptop();
    const l=laptop();const cpu=selected('cpu'),gpu=selected('gpu'),ram=selected('ram'); const pc=pcTotal(); const pcG=gpu.gpuScore||(cpu.igpu?17:0); const pcW=Math.min(96,Math.round(cpu.score*.72+ram.gb*.65+pcG*.28));
    const lapW=Math.min(93,Math.round(l.cpuScore*.8+l.ram*.48+l.gpuScore*.10));
    return sceneShell('Сравнение','Кто выиграет выбор?','Две машины стоят перед Мирой. Теперь важно сравнить не только рубли.',`<div class="versus-grid"><div class="compare-card ${memory.route==='pc'?'focus':''}"><div class="side-top"><span class="section-label">СОБРАННЫЙ ПК</span><span>01 / DESKTOP</span></div>${hardwareArt('pc')}<h2>Твоя конфигурация</h2><div class="compare-price">${money(pc)}</div><div class="comparison-details"><p><b>Процессор</b> ${e(cpu.name)}</p><p><b>Видеокарта</b> ${e(gpu.name)}</p><p><b>Память</b> ${ram.gb} ГБ ${ram.mem}</p><p><b>Накопитель</b> ${e(selected('ssd').name)}</p></div>${scoreBars('pc',pcW,pcG,4,92)}<div class="compare-notes">✓ Просто обновлять компоненты<br>✓ Большой выбор экранов и периферии<br>− Для работы нужен стол и монитор</div><button class="ghost full" data-act="go" data-scene="Конструктор">Изменить сборку</button></div><div class="vs">VS</div><div class="compare-card ${memory.route==='laptop'?'focus':''}"><div class="side-top"><span class="section-label">ГОТОВЫЙ НОУТБУК</span><span>02 / MOBILE</span></div>${hardwareArt('laptop')}<h2>${e(l.name)}</h2><div class="compare-price">≈ ${money(l.p)}</div><div class="comparison-details"><p><b>Процессор</b> ${e(l.cpu)}</p><p><b>Видеокарта</b> ${e(l.gpu)}</p><p><b>Память</b> ${l.ram} ГБ</p><p><b>Накопитель</b> ${l.storage} ГБ SSD</p></div>${scoreBars('lap',lapW,l.gpuScore,94,27)}<div class="compare-notes">✓ Экран, батарея и клавиатура включены<br>✓ Можно работать в дороге<br>− Меньше возможностей апгрейда</div><button class="ghost full" data-act="go" data-scene="Ноутбуки">Другой ноутбук</button></div></div><div class="decision-panel"><div><div class="section-label">ОСТАЛСЯ ПОСЛЕДНИЙ ШАГ</div><h2>${isValid()?'Что отправляем в мастерскую?':'Сначала исправь ошибки сборки'}</h2><p>${isValid()?`ПК ${pc<=memory.budget?'вписывается':'не вписывается'} в бюджет. Ноутбук ${l.p<=memory.budget?'вписывается':'не вписывается'} в бюджет. Разница: ${money(Math.abs(pc-l.p))} (${pc<l.p?'ПК дешевле':'ноутбук дешевле'}).`:'Несовместимые комплектующие нельзя рекомендовать как готовую сборку. Мира просит перепроверить её.'}</p></div><div class="decision-buttons"><button class="primary" data-act="decision" data-id="pc" ${!isValid()?'disabled':''}>Выбираю ПК</button><button class="secondary" data-act="decision" data-id="laptop">Выбираю ноутбук</button></div></div>${speech('«Это не соревнование, где всегда побеждает мощность. Побеждает вариант, с которым тебе легче делать своё дело».')}`);
  }
  function summaryText(){
    const g=goals[memory.goal]||goals.study;
    if(memory.decision==='laptop'){const l=laptop();return `ПОСЛЕДНИЙ АПГРЕЙД — МОЙ ВЫБОР\nЗадача: ${g.title}\nБюджет: ${money(memory.budget)}\nВыбор: ноутбук ${l.name} — около ${money(l.p)}\n${l.cpu} / ${l.ram} ГБ RAM / ${l.storage} ГБ SSD / ${l.gpu}\n${l.url}\nОриентиры цен: ноябрь 2026; проверь цену и доступность в DNS перед покупкой.`;}
    return `ПОСЛЕДНИЙ АПГРЕЙД — МОЯ СБОРКА\nЗадача: ${g.title}\nБюджет: ${money(memory.budget)}\nСистемный блок: ${money(pcTotal())}\n\n${sectionOrder.map(k=>labels[k]+': '+selected(k).name+' — '+money(selected(k).p)+(selected(k).url?'\n'+selected(k).url:'')).join('\n\n')}\n\nМонитор, периферия и операционная система не включены. Ориентиры цен: ноябрь 2026; проверь цену и совместимость в DNS перед покупкой.`;
  }
  function finalScene(){
    if(!memory.decision)memory.decision='pc';const l=laptop();const win=memory.decision==='pc';const price=win?pcTotal():l.p;const within=price<=memory.budget;const g=goals[memory.goal]||goals.study;
    const status=within?'СМЕНА ЗАВЕРШЕНА':'ПЛАН ТРЕБУЕТ ДОПОЛНЕНИЯ';
    return sceneShell('Финал','Свет в мастерской не погас','Под утро Мира зажигает вывеску «Спектра». Решение принято.',`<div class="ending"><div class="ending-star">✦</div><div class="eyebrow">ЭПИЛОГ / ${status}</div><h2>${within?'Ты собрал план будущего.':'Мечта сильнее бюджета — пока.'}</h2><p>${win?'Ты выбрал настольный ПК, потому что контроль над комплектующими и возможность обновления важнее мобильности.':'Ты выбрал ноутбук, потому что твоя мастерская может путешествовать вместе с тобой.'} ${within?'Техника подходит под выбранный лимит — по ценовым ориентирам истории.':'Выбранная техника дороже лимита. Это не поражение: можно вернуться и подобрать доступнее.'}</p><div class="ending-stats"><div><span>ЦЕЛЬ</span><strong>${e(g.title)}</strong></div><div><span>РЕШЕНИЕ</span><strong>${win?'ПК':'Ноутбук'}</strong></div><div><span>СТОИМОСТЬ</span><strong>${money(price)}</strong></div></div><div class="ending-items">${win?sectionOrder.map(k=>`<div><span>${labels[k]}</span><b>${e(selected(k).name)}</b>${selected(k).url?`<a href="${e(selected(k).url)}" target="_blank" rel="noopener noreferrer">DNS ↗</a>`:'<i>встроенная</i>'}</div>`).join(''):`<div><span>Ноутбук</span><b>${e(l.name)}</b><a href="${e(l.url)}" target="_blank" rel="noopener noreferrer">DNS ↗</a></div>`}</div><div class="end-actions"><button class="primary" data-act="copy">Скопировать подборку ↗</button><button class="ghost" data-act="go" data-scene="Сравнение">← Изменить решение</button><button class="ghost" data-act="restart">Новая история ↺</button></div><div class="copy-note" id="copy-note" role="status" aria-live="polite"></div></div>${speech('«Железо стареет. А умение выбирать то, что подходит твоим задачам, — остаётся».')}<div class="source-note">Цены в истории — снимок и ориентиры по DNS и другим открытым предложениям на ноябрь 2026. Наличие и стоимость зависят от региона. Это не коммерческое предложение; сравнение мощностей условное, не бенчмарк. Перед покупкой проверь BIOS, габариты, разъёмы и ОС.</div>`);
  }
  function render(){
    const root=document.querySelector('#novel-root');if(!root)return;
    if(!memory._ready){restore();memory._ready=true;}
    const scene=root.getAttribute('data-scene')||fallbackScene;
    if(!memory.visited) memory.visited={};memory.visited[scene]=true;
    const body=({Пролог:intro,Задача:goalScene,Развилка:fork,Конструктор:builder,Ноутбуки:notebookScene,Сравнение:compare,Финал:finalScene}[scene]||intro)();
    root.innerHTML=`<div class="novel-app"><div class="ambient-orb one"></div><div class="ambient-orb two"></div><nav class="topnav"><button class="brand" data-act="go" data-scene="Пролог"><span class="brand-icon">◆</span> SPECTRUM <small>LAB / 2026</small></button><div class="nav-right"><span class="live"><i></i> СИСТЕМА В СЕТИ</span><button class="nav-reset" data-act="restart" title="Начать заново">↺ <span>Сброс</span></button></div></nav><main class="main-wrap">${body}</main><footer class="site-footer"><span>© СПЕКТР // интерактивная история</span><span>DNS · цены на 20.11.2026 · RUB</span><span>Сохраняется в браузере</span></footer></div>`;
    save();
  }
  document.addEventListener('click',function(ev){
    const target=ev.target.closest('[data-act]');if(!target)return;
    if(!document.querySelector('#novel-root')?.contains(target))return;
    const action=target.dataset.act;
    if(target.disabled)return;
    ev.preventDefault();
    if(action==='go')return go(target.dataset.scene);
    if(action==='goal'){memory.goal=target.dataset.id;memory.build=recommend(memory.goal,memory.budget);memory.laptopId=recommendedLaptop();memory.decision=null;return render();}
    if(action==='budget'){memory.budget=Number(target.dataset.value);if(memory.goal){memory.build=recommend(memory.goal,memory.budget);memory.laptopId=recommendedLaptop();}return render();}
    if(action==='continue-goal'){if(!memory.goal)return;memory.build=recommend(memory.goal,memory.budget);memory.laptopId=recommendedLaptop();return go('Развилка');}
    if(action==='route'){memory.route=target.dataset.id; if(!memory.build.cpu)memory.build=recommend(memory.goal||'study',memory.budget); if(!memory.laptopId)memory.laptopId=recommendedLaptop();return go(memory.route==='pc'?'Конструктор':'Ноутбуки');}
    if(action==='part'){
      const cat=target.dataset.cat,id=target.dataset.id;
      memory.build[cat]=id;
      if(cat==='cpu'){
        const plat=selected('cpu').plat;
        if(selected('board')?.plat!==plat) memory.build.board=plat==='AM4'?'b550':'b650';
        if(selected('ram')?.mem!==(plat==='AM4'?'DDR4':'DDR5')) memory.build.ram=plat==='AM4'?'d416':'d516';
      }
      memory.decision=null;return render();
    }
    if(action==='auto'){memory.build=recommend(memory.goal||'study',memory.budget);return render();}
    if(action==='laptop'){memory.laptopId=target.dataset.id;memory.decision=null;return render();}
    if(action==='decision'){memory.decision=target.dataset.id;memory.route=memory.decision;return go('Финал');}
    if(action==='restart'){if(!window.confirm('Начать новую историю? Текущий выбор будет сброшен.'))return;memory=init();save();return go('Пролог');}
    if(action==='copy'){
      const txt=summaryText();const note=document.querySelector('#copy-note');
      function feedback(s){if(note)note.textContent=s;}
      if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(()=>feedback('Готово! Список комплектующих и ссылки скопированы.')).catch(()=>fallback());
      else fallback();
      function fallback(){const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();let ok=false;try{ok=document.execCommand('copy');}catch(ex){}t.remove();feedback(ok?'Готово! Подборка скопирована.':'Копирование недоступно в этом браузере. Открой файл в Chrome или Firefox.');}
    }
  });
  document.addEventListener('input',function(ev){if(ev.target?.id==='budget-range'){
    const n=Number(ev.target.value); const label=document.querySelector('.budget-number');if(label)label.textContent=money(n);
  }});
  document.addEventListener('change',function(ev){if(ev.target?.id==='budget-range'){
    memory.budget=Number(ev.target.value);if(memory.goal){memory.build=recommend(memory.goal,memory.budget);memory.laptopId=recommendedLaptop();}render();
  }});
  window.addEventListener('popstate',function(evt){if(isTwine())return;const scene=evt.state?.scene||decodeURIComponent(location.hash.slice(1)); if(scenes.includes(scene)){fallbackScene=scene;const root=document.querySelector('#novel-root');root?.setAttribute('data-scene',scene);render();}});
  function onReady(){if(!isTwine()&&location.hash){let name='';try{name=decodeURIComponent(location.hash.slice(1));}catch(ex){}if(scenes.includes(name)){fallbackScene=name;document.querySelector('#novel-root')?.setAttribute('data-scene',name);}}render();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',onReady);else onReady();
  if(window.jQuery){window.jQuery(document).on(':passageend',function(){render();});}
  window.PC_NOVEL_TEST={catalog,laptops,recommend,issues:computeIssues,getState:()=>JSON.parse(JSON.stringify(memory)),getTotal:pcTotal,go};
})();

</script></body></html>
